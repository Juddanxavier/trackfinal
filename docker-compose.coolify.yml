# Docker Compose for Coolify (PostgreSQL & Redis already provided)
version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - BCRYPT_ROUNDS=12
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGIN=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SENTRY_DSN=${SENTRY_DSN}
      - TRACKING_PROVIDER=17track
      - TRACK17_API_KEY=${TRACK17_API_KEY}
      - NOTIFICATION_EMAIL_ENABLED=true
      - NOTIFICATION_WHATSAPP_ENABLED=false
      - NOTIFICATION_INAPP_ENABLED=true
      - NOTIFICATION_USE_QUEUE=true
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build: ./admin
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  gajantraders:
    build: ./gajantraders
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
    ports:
      - "3001:3001"
    depends_on:
      - backend